<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#F9EFEB" />
      <stop offset="100%" stopColor="#F6E7DF" />
    </linearGradient>

    <linearGradient id="btnCoral2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#FF5C4D" />
      <stop offset="100%" stopColor="#FA7666" />
    </linearGradient>

    <linearGradient id="logoGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FF5C4D" />
      <stop offset="100%" stopColor="#FFA26B" />
    </linearGradient>

    <linearGradient id="sunsetSky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#FA8271" />
      <stop offset="100%" stopColor="#FDD8C7" />
    </linearGradient>

    <filter id="cardShadow2" x="60" y="70" width="1080" height="660" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#7B3A2C" flood-opacity="0.12" />
    </filter>

    <style>
      .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="800" fill="url(#bgGrad2)" />

  <!-- TOP NAVBAR -->
  <g transform="translate(110, 42)">
    <rect x="0" y="0" width="38" height="38" rx="12" fill="url(#logoGrad2)" />
    <path d="M19 14 C16 10 10 12 10 17 C10 22 19 28 19 28 C19 28 28 22 28 17 C28 12 22 10 19 14 Z" fill="#FFFFFF" />
    <text x="48" y="22" fill="#0F172A" font-size="18" font-weight="800" class="font-sans" letter-spacing="-0.3">CarePoint</text>
    <text x="48" y="34" fill="#FF5C4D" font-size="9" font-weight="800" class="font-sans" letter-spacing="1.5">HEALTH &amp; MEDICINE</text>

    <!-- Language Switcher Pill -->
    <rect x="800" y="3" width="105" height="32" rx="16" fill="#FFFFFF" stroke="#F1E5DF" stroke-width="1.2" />
    <circle cx="818" cy="19" r="8" fill="#012169" />
    <text x="832" y="23" fill="#334155" font-size="11" font-weight="700" class="font-sans">English</text>
  </g>

  <!-- MAIN CARD CONTAINER -->
  <g filter="url(#cardShadow2)">
    <rect x="110" y="100" width="980" height="600" rx="30" fill="#FFFFFF" />

    <!-- RIGHT SHOWCASE PANEL (Dark Navy) -->
    <clipPath id="cardClip2">
      <rect x="110" y="100" width="980" height="600" rx="30" />
    </clipPath>

    <g clip-path="url(#cardClip2)">
      <rect x="630" y="100" width="460" height="600" fill="#121924" />
      <g opacity="0.35">
        <rect x="630" y="100" width="460" height="240" fill="url(#sunsetSky2)" />
        <circle cx="980" cy="160" r="35" fill="#FFEAA5" />
      </g>
      <rect x="630" y="240" width="460" height="460" fill="#121924" opacity="0.95" />

      <!-- Headline -->
      <text x="665" y="295" fill="#FFFFFF" font-size="24" font-weight="800" class="font-sans" letter-spacing="-0.5">Your Personal Health &amp;</text>
      <text x="665" y="328" fill="#FFFFFF" font-size="24" font-weight="800" class="font-sans" letter-spacing="-0.5">Medicine Companion</text>

      <text x="665" y="365" fill="#94A3B8" font-size="12" font-weight="500" class="font-sans">Manage prescriptions, doctor appointments, and 24/7 clinic</text>
      <text x="665" y="385" fill="#94A3B8" font-size="12" font-weight="500" class="font-sans">consultations seamlessly in one place.</text>

      <!-- Micro-cards -->
      <rect x="665" y="420" width="390" height="60" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.1" />
      <text x="724" y="448" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Annual Health Check Tomorrow</text>
      <text x="724" y="464" fill="#94A3B8" font-size="11" font-weight="500" class="font-sans">09:00 AM • Sekarwangi Clinic &amp; Pharmacy</text>
    </g>

    <!-- LEFT LOGIN FORM WITH ACTIVE VALIDATION ERRORS -->
    <g transform="translate(160, 140)">
      <!-- Badge -->
      <rect x="0" y="0" width="180" height="26" rx="13" fill="#FFF1F0" stroke="#FFE4E1" stroke-width="1" />
      <circle cx="14" cy="13" r="3.5" fill="#FF5C4D" />
      <text x="24" y="17" fill="#FF5C4D" font-size="10" font-weight="800" class="font-sans" letter-spacing="0.5">CAREPOINT HEALTH NETWORK</text>

      <!-- Title & Subtitle -->
      <text x="0" y="58" fill="#0F172A" font-size="28" font-weight="800" class="font-sans" letter-spacing="-0.8">Welcome Back</text>
      <text x="0" y="82" fill="#64748B" font-size="12" font-weight="500" class="font-sans">Please sign in to access your clinic schedule &amp; medicine reminders</text>

      <!-- FIELD 1: Email Address (ERROR STATE - RED BORDER) -->
      <text x="0" y="130" fill="#334155" font-size="12" font-weight="700" class="font-sans">Email Address</text>
      <!-- Error Message Badge on Right of Label -->
      <circle cx="280" cy="126" r="6" fill="#F43F5E" />
      <text x="280" y="129" fill="#FFFFFF" font-size="9" font-weight="800" class="font-sans" text-anchor="middle">!</text>
      <text x="292" y="130" fill="#E11D48" font-size="11" font-weight="700" class="font-sans">Email address is required</text>

      <!-- Input box with RED BORDER and soft red glow -->
      <rect x="-2" y="140" width="414" height="50" rx="16" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2.5" />
      <!-- Mail Icon in RED -->
      <path d="M18 160 L32 170 L46 160" stroke="#F43F5E" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <rect x="18" y="157" width="28" height="18" rx="2" stroke="#F43F5E" stroke-width="1.8" fill="none" />
      <text x="56" y="171" fill="#FDA4AF" font-size="13" font-weight="500" class="font-sans">Enter your email</text>

      <!-- FIELD 2: Password (ERROR STATE - RED BORDER) -->
      <text x="0" y="222" fill="#334155" font-size="12" font-weight="700" class="font-sans">Password</text>
      <!-- Error Message Badge on Right of Label -->
      <circle cx="295" cy="218" r="6" fill="#F43F5E" />
      <text x="295" y="221" fill="#FFFFFF" font-size="9" font-weight="800" class="font-sans" text-anchor="middle">!</text>
      <text x="307" y="222" fill="#E11D48" font-size="11" font-weight="700" class="font-sans">Password is required</text>

      <!-- Input box with RED BORDER and soft red glow -->
      <rect x="-2" y="232" width="414" height="50" rx="16" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2.5" />
      <!-- Lock Icon in RED -->
      <rect x="23" y="252" width="18" height="14" rx="2" stroke="#F43F5E" stroke-width="1.8" fill="none" />
      <path d="M26 252 L26 247 C26 243 38 243 38 247 L38 252" stroke="#F43F5E" stroke-width="1.8" fill="none" />
      <text x="56" y="263" fill="#FDA4AF" font-size="13" font-weight="500" class="font-sans">Enter your password</text>

      <!-- Remember Me & Forgot Password -->
      <rect x="0" y="302" width="16" height="16" rx="5" fill="#E2E8F0" />
      <text x="26" y="314" fill="#475569" font-size="12" font-weight="600" class="font-sans">Remember me</text>
      <text x="410" y="314" fill="#FF5C4D" font-size="12" font-weight="700" class="font-sans" text-anchor="end">Forgot password?</text>

      <!-- Primary Sign In Button -->
      <g transform="translate(0, 338)">
        <rect x="0" y="0" width="410" height="48" rx="14" fill="url(#btnCoral2)" />
        <text x="180" y="30" fill="#FFFFFF" font-size="14" font-weight="700" class="font-sans" text-anchor="middle">Sign In to Dashboard</text>
        <path d="M265 24 L272 29 L265 34" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>

      <!-- 1-Click Quick Demo Button -->
      <g transform="translate(100, 404)">
        <rect x="0" y="0" width="210" height="30" rx="15" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <path d="M30 15 L36 9 L34 14 L40 14 L32 21 L34 16 Z" fill="#F59E0B" />
        <text x="110" y="19" fill="#475569" font-size="11" font-weight="700" class="font-sans" text-anchor="middle">Fill Demo Account (1-Click)</text>
      </g>
    </g>
  </g>
</svg>

